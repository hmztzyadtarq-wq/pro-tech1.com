<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بروتك | الابتكار التقني</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="protech-core.js"></script>

    <style>
        :root { --main-bg: #ffffff; --text: #000000; }
        body { font-family: 'Cairo', sans-serif; background: var(--main-bg); color: var(--text); margin: 0; padding: 0; }
        
        /* Header */
        header { padding: 40px 50px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 800; }
        
        /* Hero Section */
        .hero { padding: 100px 50px; }
        .hero h1 { font-size: 85px; font-weight: 800; line-height: 0.9; margin-bottom: 20px; }
        .hero p { font-size: 22px; max-width: 600px; color: #444; }

        /* Grid Section */
        .section-title { padding: 50px 50px 20px; font-size: 40px; font-weight: 800; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 40px; padding: 20px 50px 100px; }
        
        .card-item { border: 1px solid #f0f0f0; padding: 20px; transition: 0.4s; cursor: pointer; }
        .card-item:hover { border-color: #000; }
        .card-item img { width: 100%; height: 300px; object-fit: cover; margin-bottom: 20px; }
        .card-item h3 { font-size: 28px; margin: 0 0 10px; }
        .card-item p { color: #666; margin-bottom: 20px; }
        .btn-view { border: 1px solid #000; padding: 12px 30px; background: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo">PROTECH.</div>
        <div id="cartIndicator" onclick="toggleCart()">🛒 السلة (0)</div>
    </header>

    <section class="hero">
        <h1>حلولنا هي<br>مستقبلك التقني.</h1>
        <p>نحن نبتكر أنظمة لا تعمل فقط - بل تتوسع، وتصمد، وتستمر تحت أي ضغط.</p>
    </section>

    <h2 class="section-title">المكن والماكينات</h2>
    <div class="grid" id="machinesContainer">
        <!-- سيتم ملؤها بواسطة JS -->
    </div>

    <script>
        // إعداد الاتصال بقاعدة البيانات وعرض المحتوى
        const db = firebase.firestore();

        document.addEventListener("DOMContentLoaded", () => {
            db.collection("site_media").onSnapshot((snapshot) => {
                const container = document.getElementById('machinesContainer');
                container.innerHTML = '';
                
                snapshot.forEach((doc) => {
                    const item = doc.data();
                    if(item.category === 'machines') {
                        container.innerHTML += `
                            <div class="card-item">
                                <img src="${item.imageUrl}" alt="${item.title}">
                                <h3>${item.title}</h3>
                                <p>${item.desc.substring(0, 100)}...</p>
                                <button class="btn-view" onclick="addToCart('${item.title}', 0)">إضافة للطلب</button>
                            </div>
                        `;
                    }
                });
            });
            updateCartCounter();
        });
    </script>
</body>
</html>
