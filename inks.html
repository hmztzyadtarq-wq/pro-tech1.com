<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم الأحبار والمواد الاستهلاكية - شركة بروتك</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- External Stylesheet (ملف التصميم الرئيسي للموقع) -->
    <link rel="stylesheet" href="style.css">

    <!-- تعديلات سريعة لضمان تطابق الهيدر، السلة، وترتيب المنتجات بالعرض -->
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            direction: rtl;
        }

        .main-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .main-container h1 {
            text-align: center;
            color: #222;
            margin-bottom: 10px;
        }

        /* تنسيق شبكة المنتجات لتظهر بالعرض (أفقيًا) بجوار بعضها */
        .inks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        /* تنسيق كارت المنتج الفردي */
        .inks-grid .product, .inks-grid > div {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s ease;
        }

        .inks-grid > div:hover {
            transform: translateY(-5px);
        }

        .inks-grid img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        /* زر إفراغ السلة داخل نافذة السلة أو الصفحة */
        .clear-cart-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            transition: background 0.2s;
            margin: 10px 0;
        }

        .clear-cart-btn:hover {
            background-color: #c82333;
        }
    </style>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- ملف التحكم المركزي والسكريبتات -->
    <script src="protech-core.js"></script>
    <script src="script.js"></script>
</head>
<body>

    <!-- الهيدر الموابق تماماً لشكل وتصميم صفحة الرئيسية -->
    <header id="siteHeader">
        <!-- زر السلة أصبح على الطرف الأيسر تماماً مثل صفحة الـ Index -->
        <div class="header-actions">
            <button class="cart-trigger-btn" onclick="openCartModal()">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>السلة</span>
                <span class="cart-badge" id="cart-count">0</span>
            </button>
            <button class="nav-toggle" id="navToggle" aria-label="فتح القائمة">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <!-- أزرار التنقل في المنتصف / اليمين حسب الـ CSS الرئيسي -->
        <nav class="nav-icons" id="mainNav">
            <button onclick="location.href='index.html'" class="nav-btn">
                <i class="fa-solid fa-house"></i><span>الرئيسية</span>
            </button>
            <button onclick="location.href='videos.html'" class="nav-btn">
                <i class="fa-solid fa-print"></i><span>المكن</span>
            </button>
            <!-- تم تفعيل كلاس active هنا ليعلم المستخدم أنه واقف داخل المتجر -->
            <button onclick="location.href='inks.html'" class="nav-btn active">
                <i class="fa-solid fa-droplet"></i><span>المتجر</span>
            </button>
            <button onclick="location.href='team.html'" class="nav-btn">
                <i class="fa-solid fa-users-gear"></i><span>الفريق</span>
            </button>
            <button onclick="location.href='settings.html'" class="nav-btn">
                <i class="fa-solid fa-gears"></i><span>الإعدادات</span>
            </button>
        </nav>

        <!-- اللوجو -->
        <div class="logo">Pro<span>Tech</span></div>
    </header>

    <!-- المحتوى الرئيسي -->
    <div class="main-container">
        <h1>قسم الأحبار والمواد الاستهلاكية</h1>
        <p style="text-align: center; color: #666; margin-bottom: 30px;">استعرض أجود أنواع الأحبار الأصلية المعتمدة.</p>

        <!-- زر إفراغ السلة (يمكن نقله أو استخدامه حسب رغبتك بجوار المنتجات أو داخل مودال السلة) -->
        <div style="text-align: left; max-width: 1200px; margin: 0 auto;">
            <button class="clear-cart-btn" onclick="clearEntireCart()">
                <i class="fa-solid fa-trash-can"></i> إفراغ السلة بالكامل
            </button>
        </div>

        <div class="inks-grid" id="inksContainer">
            <p style="text-align: center; grid-column: 1 / -1; color: #777;">جاري تحميل الأحبار...</p>
        </div>
    </div>

    <!-- التشغيل وجافاسكريبت إفراغ السلة -->
    <script>
        // تشغيل الجلب التلقائي للأحبار من ملف الـ Core المركزي
        initDynamicSection('inks', 'inksContainer', 'product');

        // دالة إفراغ السلة (تتكامل مع نظام السلة لديك عبر الـ localStorage أو دوال الـ Core)
        function clearEntireCart() {
            if (confirm('هل أنت متأكد من رغبتك في إفراغ السلة بالكامل؟')) {
                // تصفير المخزن المحلي المرتبط بالسلة (تأكد من اسم المفتاح المستخدم في script.js مثل 'cart' أو 'protech_cart')
                localStorage.removeItem('cart');
                localStorage.removeItem('protech_cart');
                
                // تحديث عداد السلة في الهيدر إن وجد
                const cartCountEl = document.getElementById('cart-count');
                if (cartCountEl) cartCountEl.innerText = '0';

                // إعادة تحميل الصفحة أو تحديث واجهة السلة
                alert('تم إفراغ السلة بنجاح.');
                location.reload();
            }
        }
    </script>
</body>
</html>
