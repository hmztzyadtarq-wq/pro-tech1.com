<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الأحبار - شركة بروتك</title>
    
    <!-- مكتبات Firebase الأساسية -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            width: 100%;
        }
        /* جعل الحاوية تملى الشاشة بالكامل */
        .dashboard-container {
            width: 98%;
            max-width: 100%;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .form-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .form-group {
            flex: 1;
            min-width: 220px;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        button[type="submit"] {
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        button[type="submit"]:hover {
            background-color: #0056b3;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        .product-thumb {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h2>إدارة أحبار شركة بروتك (متصل بقاعدة البيانات)</h2>
        
        <form id="inkForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="inkName">اسم نوع الحبر:</label>
                    <input type="text" id="inkName" required placeholder="أدخل اسم الحبر...">
                </div>
                <div class="form-group">
                    <label for="inkPrice">السعر:</label>
                    <input type="text" id="inkPrice" required placeholder="أدخل السعر...">
                </div>
                <div class="form-group">
                    <label for="inkImage">صورة الحبر:</label>
                    <input type="file" id="inkImage" accept="image/*" required>
                </div>
            </div>
            <div class="form-group">
                <label for="inkDesc">وصف الحبر والتوافق:</label>
                <textarea id="inkDesc" rows="3" placeholder="أدخل تفاصيل الألوان أو الماكينات المتوافقة..."></textarea>
            </div>
            <button type="submit">إضافة الحبر إلى السحابة</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>الصورة</th>
                    <th>اسم الحبر</th>
                    <th>السعر</th>
                    <th>الوصف</th>
                    <th>الإجراءات</th>
                </tr>
            </thead>
            <tbody id="inkTableBody">
                <!-- بيانات الأحبار ستعرض هنا تلقائياً من Firebase -->
            </tbody>
        </table>
    </div>

    <!-- كود الجافاسكريبت الخاص بصفحة الأحبار متصلاً بـ Firebase -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const firebaseConfig = {
              apiKey: "AIzaSyBzFacVVTAe2fMvCDXwexfd6Wi7cI7_1gc",
              authDomain: "bro-tech-mane.firebaseapp.com",
              projectId: "bro-tech-mane",
              storageBucket: "bro-tech-mane.firebasestorage.app",
              messagingSenderId: "391259453925",
              appId: "1:391259453925:web:0fdf19af7e23d469bb970c",
              measurementId: "G-467280QJFT"
            };

            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            const db = firebase.firestore();

            const inkForm = document.getElementById('inkForm');
            const inkTableBody = document.getElementById('inkTableBody');

            // جلب وعرض الأحبار من مجموعة "inks" في قاعدة البيانات
            if (inkTableBody) {
                db.collection("inks").onSnapshot((snapshot) => {
                    inkTableBody.innerHTML = '';
                    snapshot.forEach((doc) => {
                        const ink = doc.data();
                        const id = doc.id;
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td><img src="${ink.image || ''}" class="product-thumb" alt="صورة"></td>
                            <td>${ink.name}</td>
                            <td>${ink.price}</td>
                            <td>${ink.desc}</td>
                            <td><button onclick="deleteInk('${id}')" style="background-color: #dc3545; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer;">حذف</button></td>
                        `;
                        inkTableBody.appendChild(row);
                    });
                });
            }

            // إضافة حبر جديد إلى قاعدة بيانات Firebase
            if (inkForm) {
                inkForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const name = document.getElementById('inkName').value;
                    const price = document.getElementById('inkPrice').value;
                    const desc = document.getElementById('inkDesc').value;
                    const imageFile = document.getElementById('inkImage').files[0];

                    if (imageFile) {
                        const reader = new FileReader();
                        reader.onload = function(event) {
                            const imageUrl = event.target.result;
                            
                            db.collection("inks").add({
                                name: name,
                                price: price,
                                desc: desc,
                                image: imageUrl,
                                createdAt: firebase.firestore.FieldValue.serverTimestamp()
                            })
                            .then(() => {
                                inkForm.reset();
                                alert("تم إضافة الحبر بنجاح إلى قاعدة البيانات!");
                            })
                            .catch((error) => {
                                console.error("خطأ في الإضافة: ", error);
                            });
                        };
                        reader.readAsDataURL(imageFile);
                    }
                });
            }
        });

        // دالة حذف الحبر
        function deleteInk(id) {
            if(confirm("هل أنت متأكد من حذف هذا الحبر؟")) {
                const db = firebase.firestore();
                db.collection("inks").doc(id).delete().then(() => {
                    console.log("تم الحذف بنجاح");
                }).catch((error) => {
                    console.error("خطأ أثناء الحذف: ", error);
                });
            }
        }
    </script>
</body>
</html>
