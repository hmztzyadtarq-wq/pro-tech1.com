<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم الأحبار والمواد - شركة بروتك</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- ملف التحكم المركزي -->
    <script src="protech-core.js"></script>
  <script src=script.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f4f7f6; margin: 0; padding-bottom: 100px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100; }
        .cart-btn { background: #ff6600; color: white; padding: 8px 15px; border-radius: 20px; text-decoration: none; font-weight: bold; font-size: 14px; }
        .nav-menu { display: flex; align-items: center; gap: 25px; }
        .nav-menu a { text-decoration: none; color: #333; font-weight: 500; font-size: 15px; }
        .nav-menu a.active { color: #007bff; font-weight: bold; }
        .main-container { width: 90%; max-width: 1200px; margin: 30px auto; }
        h1 { text-align: center; color: #333; margin-bottom: 10px; }
        .inks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 30px; }
        .ink-card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 15px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; flex-direction: column; justify-content: space-between; }
        .ink-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; }
        .ink-card h3 { margin: 10px 0 5px; font-size: 18px; color: #2c3e50; }
        .ink-card p { color: #666; font-size: 14px; margin-bottom: 15px; line-height: 1.5; }
        .btn-add-cart { background-color: #28a745; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-family: 'Cairo', sans-serif; width: 100%; }
        .btn-add-cart:hover { background-color: #218838; }
    </style>
</head>
<body>

    <header class="header">
        <div class="cart-btn-container">
            <a href="cart.html" class="cart-btn" id="cartIndicator">🛒 السلة (0)</a>
        </div>
        <nav class="nav-menu">
            <a href="index.html">الرئيسية</a>
            <a href="videos.html">المكن</a>
            <a href="inks.html" class="active">الأحبار</a>
            <a href="team.html">الفريق</a>
            <a href="settings.html">الإعدادات</a>
        </nav>
        <div class="logo">
            <h2 style="margin: 0; color: #007bff;">ProTech</h2>
        </div>
    </header>

    <div class="main-container">
        <h1>قسم الأحبار والمواد الاستهلاكية</h1>
        <p style="text-align: center; color: #666; margin-bottom: 30px;">استعرض أجود أنواع الأحبار الأصلية المعتمدة.</p>

        <div class="inks-grid" id="inksContainer">
            <p style="text-align: center; grid-column: 1 / -1; color: #777;">جاري تحميل الأحبار...</p>
        </div>
    </div>

    <script>
        // تشغيل الجلب التلقائي للأحبار فقط من ملف الـ Core المركزى
        initDynamicSection('inks', 'inksContainer', 'product');
    </script>
</body>
</html>
