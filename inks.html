<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم الأحبار والمواد الاستهلاكية - شركة بروتك</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ملف التصميم الرئيسي للموقع -->
    <link rel="stylesheet" href="style.css">

    <!-- تنسيقات عرض المنتجات وزر إفراغ السلة داخل نافذة الفاتورة -->
    <style>
        .main-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .main-container h1 {
            text-align: center;
            color: #222;
            margin-bottom: 10px;
        }

        /* تنسيق شبكة المنتجات لتظهر بالعرض (أفقيًا) */
        .inks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        /* كارت المنتج الفردي */
        .inks-grid .product, .inks-grid > div {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s ease;
        }

        .inks-grid > div:hover {
            transform: translateY(-5px);
        }

        .inks-grid img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        /* تنسيق زر إفراغ السلة ليتناسب مع أزرار الفاتورة في باقي الموقع */
        .clear-cart-modal-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin-top: 10px;
            width: 100%;
        }

        .clear-cart-modal-btn:hover {
            background-color: #c82333;
        }
    </style>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- ملف التحكم المركزي والسكريبتات -->
    <script src="protech-core.js"></script>
    <script src="script.js"></script>
</head>
<body>

    <!-- الهيدر الأصلي المتطابق تماماً مع صفحة الرئيسية (اللوجو يمين - السلة شمال) -->
    <header id="siteHeader">
        <div class="logo">Pro<span>Tech</span></div>

        <nav class="nav-icons" id="mainNav">
            <button onclick="location.href='index.html'" class="nav-btn">
                <i class="fa-solid fa-house"></i><span>الرئيسية</span>
            </button>
            <button onclick="location.href='videos.html'" class="nav-btn">
                <i class="fa-solid fa-print"></i><span>المكن</span>
            </button>
            <!-- تفعيل كلاس active لزر المتجر -->
            <button onclick="location.href='inks.html'" class="nav-btn active">
                <i class="fa-solid fa-droplet"></i><span>المتجر</span>
            </button>
            <button onclick="location.href='team.html'" class="nav-btn">
                <i class="fa-solid fa-users-gear"></i><span>الفريق</span>
            </button>
            <button onclick="location.href='settings.html'" class="nav-btn">
                <i class="fa-solid fa-gears"></i><span>الإعدادات</span>
            </button>
        </nav>

        <div class="header-actions">
            <button class="cart-trigger-btn" onclick="openCartModal()">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>السلة</span>
                <span class="cart-badge" id="cart-count">0</span>
            </button>
            <button class="nav-toggle" id="navToggle" aria-label="فتح القائمة">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <div class="main-container">
        <h1>قسم الأحبار والمواد الاستهلاكية</h1>
        <p style="text-align: center; color: #666; margin-bottom: 30px;">استعرض أجود أنواع الأحبار الأصلية المعتمدة.</p>

        <!-- شبكة المنتجات (معروضة بالعرض) -->
        <div class="inks-grid" id="inksContainer">
            <p style="text-align: center; grid-column: 1 / -1; color: #777;">جاري تحميل الأحبار...</p>
        </div>
    </div>

    <!-- السكريبتات -->
    <script>
        // تشغيل الجلب التلقائي للأحبار من ملف الـ Core المركزي
        initDynamicSection('inks', 'inksContainer', 'product');

        // دالة إفراغ السلة
        function clearEntireCart() {
            if (confirm('هل أنت متأكد من رغبتك في إفراغ السلة بالكامل؟')) {
                localStorage.removeItem('cart');
                localStorage.removeItem('protech_cart');
                
                const cartCountEl = document.getElementById('cart-count');
                if (cartCountEl) cartCountEl.innerText = '0';

                location.reload();
            }
        }

        // حقن زر "إفراغ السلة" بداخل نافذة الفاتورة عند فتحها تلقائياً دون التأثير على وظائف الموقع الأصلية
        const originalOpenCartModal = window.openCartModal;
        window.openCartModal = function() {
            if (typeof originalOpenCartModal === 'function') {
                originalOpenCartModal();
            }
            
            setTimeout(() => {
                // البحث عن النافذة أو الأزرار داخل مودال الفاتورة لإضافة زر الإفراغ بلطف
                const modalContent = document.querySelector('.cart-modal-content, .modal-content, div[class*="modal"]');
                if (modalContent && !document.getElementById('customClearCartBtn')) {
                    const clearBtn = document.createElement('button');
                    clearBtn.id = 'customClearCartBtn';
                    clearBtn.className = 'clear-cart-modal-btn';
                    clearBtn.innerHTML = '<i class="fa-solid fa-trash-can"></i> إفراغ السلة بالكامل';
                    clearBtn.onclick = clearEntireCart;
                    
                    modalContent.appendChild(clearBtn);
                }
            }, 150);
        };
    </script>
</body>
</html>
