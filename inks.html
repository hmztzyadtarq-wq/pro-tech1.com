<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الأحبار - شركة بروتك</title>
    
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 15px;
            width: 100%;
        }
        .dashboard-container {
            width: 100%;
            min-height: 90vh;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .form-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .form-group {
            flex: 1;
            min-width: 250px;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        button[type="submit"] {
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }
        button[type="submit"]:hover {
            background-color: #0056b3;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #007bff;
            color: white;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h2>إدارة أحبار شركة بروتك (ملء الشاشة ومتصل بالداتابيز)</h2>
        
        <form id="inkForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="inkName">اسم الحبر:</label>
                    <input type="text" id="inkName" required placeholder="أدخل اسم الحبر...">
                </div>
                <div class="form-group">
                    <label for="inkPrice">السعر:</label>
                    <input type="text" id="inkPrice" required placeholder="أدخل السعر...">
                </div>
                <div class="form-group">
                    <label for="inkImage">صورة الحبر:</label>
                    <input type="file" id="inkImage" accept="image/*" required>
                </div>
            </div>
            <div class="form-group">
                <label for="inkDesc">الوصف:</label>
                <textarea id="inkDesc" rows="3" placeholder="تفاصيل إضافية..."></textarea>
            </div>
            <button type="submit">إضافة الحبر</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>الصورة</th>
                    <th>اسم الحبر</th>
                    <th>السعر</th>
                    <th>الوصف</th>
                    <th>الإجراءات</th>
                </tr>
            </thead>
            <tbody id="inkTableBody">
                <!-- البيانات تظهر هنا تلقائياً -->
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
