<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منتجات شركة بروتك للماكينات والأحبار</title>
    
    <!-- مكتبات Firebase الأساسية -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            width: 100%;
        }
        .main-container {
            width: 100%;
            min-height: 90vh;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
            margin-top: 0;
            text-align: center;
        }
        h2 {
            color: #007bff;
            margin-top: 40px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .product-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background: #fff;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .product-card h3 {
            margin: 10px 0 5px;
            color: #333;
        }
        .product-card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .price {
            font-weight: bold;
            color: #28a745;
            font-size: 16px;
            margin-bottom: 15px;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn-cart {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-cart:hover { background-color: #0056b3; }
        .btn-wishlist {
            background-color: #ffc107;
            color: #333;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-wishlist:hover { background-color: #e0a800; }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>معرض شركة بروتك للماكينات والأحبار</h1>

        <!-- قسم الماكينات والمنتجات -->
        <h2>الماكينات والمنتجات المتوفرة</h2>
        <div id="productsGrid" class="products-grid">
            <!-- سيتم جلب وعرض المنتجات هنا تلقائياً من Firebase -->
        </div>

        <!-- قسم الأحبار -->
        <h2>الأحبار المتوفرة</h2>
        <div id="inksGrid" class="products-grid">
            <!-- سيتم جلب وعرض الأحبار هنا تلقائياً من Firebase -->
        </div>
    </div>

    <!-- كود الجافاسكريبت الخاص بالعرض والتفاعل مع السلة والمفضلة -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const firebaseConfig = {
              apiKey: "AIzaSyBzFacVVTAe2fMvCDXwexfd6Wi7cI7_1gc",
              authDomain: "bro-tech-mane.firebaseapp.com",
              projectId: "bro-tech-mane",
              storageBucket: "bro-tech-mane.firebasestorage.app",
              messagingSenderId: "391259453925",
              appId: "1:391259453925:web:0fdf19af7e23d469bb970c",
              measurementId: "G-467280QJFT"
            };

            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            const db = firebase.firestore();

            const productsGrid = document.getElementById('productsGrid');
            const inksGrid = document.getElementById('inksGrid');

            // جلب المنتجات وعرضها
            if (productsGrid) {
                db.collection("products").onSnapshot((snapshot) => {
                    productsGrid.innerHTML = '';
                    snapshot.forEach((doc) => {
                        const product = doc.data();
                        const id = doc.id;
                        const card = document.createElement('div');
                        card.className = 'product-card';
                        card.innerHTML = `
                            <img src="${product.image || ''}" alt="صورة المنتج">
                            <h3>${product.name}</h3>
                            <p>${product.desc || ''}</p>
                            <div class="price">${product.price} جنيه</div>
                            <div class="btn-container">
                                <button class="btn-cart" onclick="addToCart('${product.name}', '${product.price}')">إضافة للسلة</button>
                                <button class="btn-wishlist" onclick="addToWishlist('${product.name}', '${product.price}')">المفضلة</button>
                            </div>
                        `;
                        productsGrid.appendChild(card);
                    });
                });
            }

            // جلب الأحبار وعرضها
            if (inksGrid) {
                db.collection("inks").onSnapshot((snapshot) => {
                    inksGrid.innerHTML = '';
                    snapshot.forEach((doc) => {
                        const ink = doc.data();
                        const id = doc.id;
                        const card = document.createElement('div');
                        card.className = 'product-card';
                        card.innerHTML = `
                            <img src="${ink.image || ''}" alt="صورة الحبر">
                            <h3>${ink.name}</h3>
                            <p>${ink.desc || ''}</p>
                            <div class="price">${ink.price} جنيه</div>
                            <div class="btn-container">
                                <button class="btn-cart" onclick="addToCart('${ink.name}', '${ink.price}')">إضافة للسلة</button>
                                <button class="btn-wishlist" onclick="addToWishlist('${ink.name}', '${ink.price}')">المفضلة</button>
                            </div>
                        `;
                        inksGrid.appendChild(card);
                    });
                });
            }
        });

        // دوال الإضافة للسلة والمفضلة وحفظها في سحابة Firebase لتظل ثابتة
        function addToCart(name, price) {
            const db = firebase.firestore();
            db.collection("cart").add({
                name: name,
                price: price,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("تم إضافة المنتج إلى سلة المشتريات بنجاح!");
            }).catch((error) => console.error("خطأ: ", error));
        }

        function addToWishlist(name, price) {
            const db = firebase.firestore();
            db.collection("wishlist").add({
                name: name,
                price: price,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("تم إضافة المنتج إلى المفضلة بنجاح!");
            }).catch((error) => console.error("خطأ: ", error));
        }
    </script>
</body>
</html>
